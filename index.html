<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÚSAR ROCK - Emoción y Recuerdos 24/7</title>
    <style>
        /* Diseño ultra ligero optimizado para Smart TV Hisense */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0d;
            background-image: radial-gradient(circle at center, #1f1714 0%, #050507 100%);
            color: #f4f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden; /* Evita barras de desplazamiento en la TV */
        }
        .container {
            max-width: 900px;
            padding: 20px;
        }
        /* Espacio reservado para tu futuro logo */
        .logo-frame {
            width: 240px;
            height: 240px;
            margin: 0 auto 30px auto;
            border-radius: 50%;
            border: 4px solid #d97706; /* Dorado ámbar vintage */
            box-shadow: 0 0 35px rgba(217, 119, 6, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #141417;
            overflow: hidden;
        }
        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-placeholder {
            font-size: 1.1rem;
            color: #d97706;
            font-weight: bold;
            letter-spacing: 2px;
        }
        h1 {
            font-size: 4.5rem;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(220, 38, 38, 0.6);
            margin-bottom: 10px;
            font-weight: 900;
        }
        .slogan {
            font-size: 1.8rem;
            letter-spacing: 8px;
            color: #f59e0b;
            text-transform: uppercase;
            margin-bottom: 40px;
            font-weight: 300;
        }
        .badge-live {
            display: inline-block;
            background-color: #dc2626;
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }
        .decades {
            font-size: 1.2rem;
            color: #9ca3af;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }
        /* Reproductor nativo de alto rendimiento */
        audio {
            width: 100%;
            max-width: 600px;
            height: 55px;
            border-radius: 30px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge-live">● EN VIVO 24/7</div>

        <!-- CUANDO TENGAS TU LOGO: 
             1. Súbelo a GitHub como "logo.png"
             2. Borra la línea del div "logo-placeholder" 
             3. Quita los símbolos de comentario de la etiqueta <img> de abajo -->
        <div class="logo-frame">
            <div class="logo-placeholder">LOGO<br>HÚSAR ROCK</div>
            <!-- <img src="logo.png" alt="Logo Húsar Rock"> -->
        </div>

        <h1>HÚSAR ROCK</h1>
        <div class="slogan">Emoción y Recuerdos</div>
        <div class="decades">60s • 70s • 80s • 90s</div>

        <!-- REPRODUCTOR DE AUDIO:
             Reemplaza "TU_ENLACE_DE_STREAMING_AQUI" por la URL de tu radio -->
        <audio autoplay controls>
            <source src="TU_ENLACE_DE_STREAMING_AQUI" type="audio/mpeg">
            Tu navegador de TV no soporta la reproducción directa.
        </audio>
    </div>

</body>
</html>
