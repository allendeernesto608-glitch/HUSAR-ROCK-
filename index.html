<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÚSAR ROCK TV - Emoción y Recuerdos 24/7</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #09090b;
            color: #f4f4f6;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        /* Barra superior con esquinas */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 12px auto;
        }
        .live-pill {
            background-color: #dc2626;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 1.5px;
        }
        .corner-era {
            text-align: right;
            color: #fbbf24;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-right: 3px solid #d97706;
            padding-right: 8px;
        }
        /* Contenedor Principal */
        .tv-container {
            width: 100%;
            max-width: 850px;
            margin: auto;
            text-align: center;
        }
        /* Cabecera de marca compacta */
        .brand-header {
            margin-bottom: 12px;
        }
        h1 {
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            line-height: 1.1;
        }
        h1 span {
            color: #f59e0b;
        }
        .slogan-single {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #e4e4e7;
            text-transform: uppercase;
            margin-top: 4px;
        }
        /* Marco de Pantalla de Video (16:9 adaptable) */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Proporción exacta de TV 16:9 */
            background-color: #000000;
            border: 3px solid #d97706;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
            margin-bottom: 15px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Botonera de Canales de Video */
        .channel-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        button {
            background-color: #18181b;
            color: #e4e4e7;
            border: 2px solid #3f3f46;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            flex: 1 1 140px;
        }
        button.active {
            background-color: #d97706;
            color: #09090b;
            border-color: #fef08a;
        }
        .status {
            font-size: 0.85rem;
            color: #a1a1aa;
        }
        .status strong {
            color: #fbbf24;
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; letter-spacing: 2px; }
            .slogan-single { font-size: 0.78rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <!-- Esquinas superiores -->
    <div class="top-bar">
        <div class="live-pill">● TV EN VIVO 24/7</div>
        <div class="corner-era">CLÁSICOS DE LOS<br>60s • 70s • 80s • 90s</div>
    </div>

    <!-- Centro: Marca + Pantalla de Video + Botones -->
    <div class="tv-container">
        <div class="brand-header">
            <h1>HÚSAR <span>ROCK</span></h1>
            <div class="slogan-single">EMOCIÓN Y RECUERDOS</div>
        </div>

        <!-- Reproductor de Videos Musicales -->
        <div class="video-wrapper">
            <iframe id="tv-screen" 
                src="https://youtube.com" 
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Selector de Canales de Video -->
        <div class="channel-bar">
            <button class="active" onclick="changeChannel(this, 'https://youtube.com', 'Canal 1: Éxitos Rock Clásico')">
                CH 1: Rock Clásico
            </button>
            <button onclick="changeChannel(this, 'https://youtube.com', 'Canal 2: Videos Rock 80s')">
                CH 2: Videos 80s
            </button>
            <button onclick="changeChannel(this, 'https://youtube.com', 'Canal 3: Videos Rock 90s')">
                CH 3: Videos 90s
            </button>
            <button onclick="changeChannel(this, 'https://youtube.com', 'Canal 4: Rock de los 70s')">
                CH 4: Videos 70s
            </button>
        </div>

        <div class="status">Viendo ahora: <strong id="channel-label">Canal 1: Éxitos Rock Clásico</strong></div>
    </div>

    <div></div>

    <script>
        function changeChannel(btn, videoUrl, channelTitle) {
            var buttons = document.getElementsByTagName('button');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = '';
            }
            btn.className = 'active';
            document.getElementById('channel-label').textContent = channelTitle;
            document.getElementById('tv-screen').src = videoUrl;
        }
    </script>

</body>
</html>
