<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HÚSAR ROCK - TV y Radio 24/7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#09090b;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;padding:15px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1000px;width:100%;margin:0 auto 10px}
.live{background:#dc2626;padding:5px 12px;border-radius:4px;font-size:.8rem;font-weight:bold}
.era{text-align:right;color:#fbbf24;font-size:.8rem;font-weight:bold;border-right:3px solid #d97706;padding-right:8px}
.box{width:100%;max-width:820px;margin:auto;text-align:center}
h1{font-size:2.2rem;font-weight:900;letter-spacing:3px}
h1 span{color:#f59e0b}
.slogan{font-size:.9rem;font-weight:bold;letter-spacing:3px;color:#e4e4e7;margin:4px 0 15px}
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:15px}
.tbtn{background:#18181b;color:#a1a1aa;border:2px solid #27272a;padding:10px 15px;font-size:.9rem;font-weight:bold;border-radius:8px;cursor:pointer;flex:1;max-width:240px}
.tbtn.on{background:#dc2626;color:#fff;border-color:#fca5a5}
.sec{display:none}
.sec.on{display:block}
.tv{position:relative;width:100%;padding-bottom:56.25%;background:#000;border:3px solid #d97706;border-radius:10px;overflow:hidden;margin-bottom:12px}
.tv iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:10px}
.cbtn{background:#18181b;color:#fff;border:2px solid #3f3f46;padding:10px;font-size:.85rem;font-weight:bold;border-radius:6px;cursor:pointer;flex:1 1 150px}
.cbtn.on{background:#d97706;color:#000;border-color:#fef08a}
.rbox{background:#141417;border:3px solid #d97706;border-radius:10px;padding:20px;margin-bottom:12px}
audio{width:100%;max-width:500px;height:48px;margin-top:12px}
.st{font-size:.85rem;color:#a1a1aa;margin-top:8px}
.st strong{color:#fbbf24}
</style>
</head>
<body>
<div class="top">
  <div class="live">● EN VIVO 24/7</div>
  <div class="era">CLÁSICOS DE LOS<br>60s • 70s • 80s • 90s</div>
</div>
<div class="box">
  <h1>HÚSAR <span>ROCK</span></h1>
  <div class="slogan">EMOCIÓN Y RECUERDOS</div>
  <div class="tabs">
    <button class="tbtn on" onclick="tab(this,'v')">📺 TV VIDEOS</button>
    <button class="tbtn" onclick="tab(this,'r')">📻 RADIO INGLÉS</button>
  </div>
  <div id="v" class="sec on">
    <div class="tv">
      <iframe id="vp" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="btns">
      <button class="cbtn on" onclick="ch(this,'list','PL3us1kCwCSx0q4Zls_tmg_0C4zR1tSm16','CH 1: Playlist 380 Clásicos (70s-90s)')">CH 1: Playlist 380 Videos</button>
      <button class="cbtn" onclick="ch(this,'vid','S3aKJjS-44E','CH 2: Nirvana, Led Zeppelin, Bon Jovi, ACDC')">CH 2: Mix Éxitos Rock</button>
      <button class="cbtn" onclick="ch(this,'vid','CO3ReoRRxfc','CH 3: Top 20 Classic Rock 70s-90s')">CH 3: Top 20 Clásicos</button>
    </div>
    <div class="st">Viendo: <strong id="vs">CH 1: Playlist 380 Clásicos (70s-90s)</strong></div>
  </div>
  <div id="r" class="sec">
    <div class="rbox">
      <div class="btns">
        <button class="cbtn on" onclick="rd(this,'rp-rock','1. Radio Paradise Rock Mix')">1. Paradise Rock</button>
        <button class="cbtn" onclick="rd(this,'rp-main','2. Radio Paradise Main Mix')">2. Paradise Main</button>
        <button class="cbtn" onclick="rd(this,'labgate','3. Labgate Classic Rock (70s-90s)')">3. Labgate Classic Rock</button>
      </div>
      <audio id="ap" controls preload="none"></audio>
      <div class="st">Sintonizando: <strong id="rs">1. Radio Paradise Rock Mix</strong></div>
    </div>
  </div>
</div>
<script>
var ytBase = "https://youtube-nocookie.com";
var streams = {
  "rp-rock": "https://radioparadise.com",
  "rp-main": "https://radioparadise.com",
  "labgate": "https://ssl-stream.com"
};

function buildYtUrl(type, id) {
  if (type === 'list') {
    return ytBase + "videoseries?list=" + id + "&autoplay=1&rel=0";
  }
  return ytBase + id + "?autoplay=1&rel=0";
}

function tab(b, id) {
  var t = document.getElementsByClassName('tbtn');
  for (var i = 0; i < t.length; i++) t[i].className = 'tbtn';
  b.className = 'tbtn on';
  var s = document.getElementsByClassName('sec');
  for (var j = 0; j < s.length; j++) s[j].className = 'sec';
  document.getElementById(id).className = 'sec on';
  if (id === 'v') {
    document.getElementById('ap').pause();
  } else {
    var a = document.getElementById('ap');
    if (!a.src) a.src = streams["rp-rock"];
  }
}

function ch(b, type, id, name) {
  var c = document.getElementById('v').getElementsByClassName('cbtn');
  for (var i = 0; i < c.length; i++) c[i].className = 'cbtn';
  b.className = 'cbtn on';
  document.getElementById('vs').textContent = name;
  document.getElementById('vp').src = buildYtUrl(type, id);
}

function rd(b, key, name) {
  var c = document.getElementById('r').getElementsByClassName('cbtn');
  for (var i = 0; i < c.length; i++) c[i].className = 'cbtn';
  b.className = 'cbtn on';
  document.getElementById('rs').textContent = name;
  var a = document.getElementById('ap');
  a.src = streams[key];
  a.load();
  a.play();
}

window.onload = function() {
  document.getElementById('vp').src = buildYtUrl('list', 'PL3us1kCwCSx0q4Zls_tmg_0C4zR1tSm16');
  document.getElementById('ap').src = streams["rp-rock"];
};
</script>
</body>
</html>
