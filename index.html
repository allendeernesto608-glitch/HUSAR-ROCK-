<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÚSAR ROCK - Emoción y Recuerdos 24/7</title>
    <style>
        body {
            background-color: #070709;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .badge {
            background-color: #dc2626;
            color: #ffffff;
            padding: 5px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        /* Emblema SVG ultra ligero */
        .emblem {
            width: 100%;
            max-width: 380px;
            height: auto;
            margin-bottom: 15px;
        }
        .decades {
            color: #f59e0b;
            font-size: 1.15rem;
            letter-spacing: 4px;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .buttons {
            margin-bottom: 20px;
            max-width: 700px;
        }
        button {
            background-color: #18181b;
            color: #e4e4e7;
            border: 2px solid #3f3f46;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: bold;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
        }
        button.active {
            background-color: #d97706;
            color: #000000;
            border-color: #fbbf24;
        }
        .status {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 10px;
        }
        .status span {
            color: #ffffff;
            font-weight: bold;
        }
        audio {
            width: 95%;
            max-width: 560px;
            height: 50px;
        }
    </style>
</head>
<body>

    <div class="badge">● SEÑAL EN VIVO 24/7</div>

    <!-- Logotipo Oficial Vectorial (0 MB de RAM) -->
    <svg class="emblem" viewBox="0 0 400 400" xmlns="http://w3.org">
        <defs>
            <!-- Trayectoria curva superior para HÚSAR ROCK -->
            <path id="topArc" d="M 65,200 A 135,135 0 1,1 335,200" />
            <!-- Trayectoria curva inferior para EMOCIÓN Y RECUERDOS -->
            <path id="bottomArc" d="M 52,205 A 148,148 0 0,0 348,205" />
        </defs>

        <!-- Base del disco de vinilo y aros -->
        <circle cx="200" cy="200" r="185" fill="#121215" stroke="#dc2626" stroke-width="5"/>
        <circle cx="200" cy="200" r="122" fill="#18181b" stroke="#d97706" stroke-width="4"/>
        <circle cx="200" cy="200" r="95" fill="none" stroke="#27272a" stroke-width="2"/>
        <circle cx="200" cy="200" r="70" fill="none" stroke="#27272a" stroke-width="2"/>
        <circle cx="200" cy="200" r="45" fill="#2a1210" stroke="#dc2626" stroke-width="2"/>

        <!-- Texto Superior Arqueado -->
        <text fill="#fbbf24" font-size="33" font-weight="900" letter-spacing="4">
            <textPath href="#topArc" startOffset="50%" text-anchor="middle">
                HÚSAR ROCK
            </textPath>
        </text>

        <!-- Texto Inferior Arqueado -->
        <text fill="#f59e0b" font-size="21" font-weight="800" letter-spacing="2.5">
            <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
                EMOCIÓN Y RECUERDOS
            </textPath>
        </text>

        <!-- Guitarra Eléctrica inclinada en el centro -->
        <g transform="rotate(-42 200 200)">
            <!-- Cuerpo de la guitarra -->
            <path d="M135,175 C105,175 98,230 135,230 C150,230 158,220 172,220 C186,220 194,234 212,230 C232,225 232,180 212,175 C194,170 186,184 172,184 C158,184 150,175 135,175 Z" fill="#b91c1c" stroke="#fbbf24" stroke-width="3"/>
            <!-- Golpeador y pastillas -->
            <path d="M168,205 L205,205 L202,224 L170,224 Z" fill="#fef3c7"/>
            <rect x="145" y="193" width="10" height="19" fill="#18181b" rx="1"/>
            <rect x="172" y="191" width="13" height="23" fill="#fbbf24" rx="1"/>
            <rect x="194" y="191" width="13" height="23" fill="#fbbf24" rx="1"/>
            <!-- Controles dorados -->
            <circle cx="145" cy="220" r="3" fill="#fbbf24"/>
            <circle cx="156" cy="222" r="3" fill="#fbbf24"/>
            <!-- Mástil y clavijero -->
            <rect x="222" y="197" width="95" height="11" fill="#d97706"/>
            <polygon points="317,193 345,189 348,214 317,210" fill="#b91c1c" stroke="#fbbf24" stroke-width="2"/>
        </g>

        <!-- Notas musicales disparadas hacia arriba a la derecha -->
        <g transform="translate(275, 75)" fill="#fbbf24">
            <circle cx="7" cy="25" r="5"/>
            <circle cx="24" cy="21" r="5"/>
            <path d="M10.5,25 L10.5,6 L27.5,2 L27.5,21" stroke="#fbbf24" stroke-width="3" fill="none"/>
        </g>
        <g transform="translate(318, 108)" fill="#dc2626">
            <circle cx="6" cy="22" r="4.5"/>
            <path d="M9.5,22 L9.5,4 L17,8" stroke="#dc2626" stroke-width="3" fill="none"/>
        </g>
        <g transform="translate(250, 58)" fill="#f59e0b">
            <circle cx="5" cy="16" r="3.5"/>
            <path d="M7.5,16 L7.5,3 L13,6" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
        </g>
        <!-- Chispas de energía -->
        <line x1="268" y1="102" x2="278" y2="92" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="298" y1="125" x2="312" y2="122" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

    <div class="decades">CLÁSICOS DE LOS 60s • 70s • 80s • 90s</div>

    <div class="buttons">
        <button class="active" onclick="playRadio(this, 'https://radioparadise.com', 'Rock Clásico Mix (60s-90s)')">1. Rock Clásico Mix</button>
        <button onclick="playRadio(this, 'https://181fm.com', 'VClassic Rock')">2. VClassic Rock</button>
        <button onclick="playRadio(this, 'https://181fm.com', 'Hard Rock 80s')">3. Rock 80s</button>
        <button onclick="playRadio(this, 'https://181fm.com', 'Alternativo & Grunge 90s')">4. Rock 90s</button>
    </div>

    <div class="status">Sintonizando: <span id="station-name">Rock Clásico Mix (60s-90s)</span></div>

    <audio id="player" controls autoplay>
        <source src="https://radioparadise.com" type="audio/mpeg">
    </audio>

    <script>
        function playRadio(btn, url, name) {
            var btns = document.getElementsByTagName('button');
            for (var i = 0; i < btns.length; i++) {
                btns[i].className = '';
            }
            btn.className = 'active';
            document.getElementById('station-name').textContent = name;
            var audio = document.getElementById('player');
            audio.src = url;
            audio.play();
        }
    </script>

</body>
</html>
