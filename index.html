<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÚSAR ROCK TV - Emoción y Recuerdos 24/7</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #070709;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1050px;
            margin: 0 auto 10px auto;
        }
        .live-badge {
            background-color: #dc2626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1.5px;
        }
        .corner-era {
            text-align: right;
            color: #fbbf24;
            font-size: 0.82rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-right: 3px solid #d97706;
            padding-right: 10px;
        }
        .main-tv {
            width: 100%;
            max-width: 820px;
            margin: auto;
            text-align: center;
        }
        .brand-box {
            margin-bottom: 12px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
        }
        h1 span {
            color: #f59e0b;
        }
        .slogan-line {
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: #e4e4e7;
            text-transform: uppercase;
            margin-top: 3px;
        }
        .screen-frame {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background-color: #000000;
            border: 3px solid #d97706;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .screen-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .channels {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        button {
            background-color: #18181b;
            color: #ffffff;
            border: 2px solid #3f3f46;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            flex: 1 1 150px;
        }
        button.active {
            background-color: #d97706;
            color: #000000;
            border-color: #fef08a;
        }
        .now-watching {
            font-size: 0.85rem;
            color: #a1a1aa;
        }
        .now-watching strong {
            color: #fbbf24;
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.7rem; }
            .slogan-line { font-size: 0.75rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="live-badge">● TV EN VIVO 24/7</div>
        <div class="corner-era">CLÁSICOS DE LOS<br>60s • 70s • 80s • 90s</div>
    </div>

    <div class="main-tv">
        <div class="brand-box">
            <h1>HÚSAR <span>ROCK</span></h1>
            <div class="slogan-line">EMOCIÓN Y RECUERDOS</div>
        </div>

        <!-- Pantalla con Reproductor Embed Real -->
        <div class="screen-frame">
            <iframe id="tv-player" 
                src="https://youtube.com" 
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- 4 Canales de Video Reales -->
        <div class="channels">
            <button class="active" onclick="setChannel(this, 'https://youtube.com', 'CH 1: Transmisión Rock 24/7')">
                CH 1: Rock 24/7 Live
            </button>
            <button onclick="setChannel(this, 'https://youtube.com', 'CH 2: Videoclips Oficiales 70s-90s')">
                CH 2: Videoclips 70s-90s
            </button>
            <button onclick="setChannel(this, 'https://youtube.com', 'CH 3: Grandes Himnos 70s-90s')">
                CH 3: Himnos del Rock
            </button>
            <button onclick="setChannel(this, 'https://youtube.com', 'CH 4: Rock en Español 80s-90s')">
                CH 4: Rock en Español
            </button>
        </div>

        <div class="now-watching">Sintonizando: <strong id="ch-title">CH 1: Transmisión Rock 24/7</strong></div>
    </div>

    <div></div>

    <script>
        function setChannel(btn, embedUrl, title) {
            var allBtns = document.getElementsByTagName('button');
            for (var i = 0; i < allBtns.length; i++) {
                allBtns[i].className = '';
            }
            btn.className = 'active';
            document.getElementById('ch-title').textContent = title;
            document.getElementById('tv-player').src = embedUrl;
        }
    </script>

</body>
</html>
